_base_: ../_base_/default.yaml

env:
  name: agent_skills
  run_profile: <run-profile>
  skill_init: .agents/skillopt-work/<skill>/initial/skill-body.md
  split_mode: split_dir
  split_dir: .agents/skillopt-work/<skill>/data
  out_root: .agents/skillopt-work/<skill>/outputs/<run-name>
  reflection_backend: native
  judge_backend: codex_cli
  codex_cli_judge_model: ${SKILLOPT_JUDGE_MODEL}
  codex_cli_judge_timeout: 240
  codex_cli_judge_sandbox: read-only
  exec_timeout: 240
  workers: 4
  max_turns: 1

train:
  num_epochs: 4
  batch_size: 20
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 8
  max_analyst_rounds: 3
  failure_only: false

optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  skill_update_mode: patch
  use_slow_update: true
  slow_update_samples: 20
  use_meta_skill: true
  longitudinal_pair_policy: mixed

evaluation:
  use_gate: true
  eval_test: true
  sel_env_num: 0
  test_env_num: 0

model:
  optimizer_backend: openai_chat
  optimizer: ${SKILLOPT_OPTIMIZER_MODEL}
  target_backend: codex_exec
  target: ${SKILLOPT_TARGET_MODEL}
  codex_exec_path: codex
  codex_exec_use_sdk: cli
  codex_exec_full_auto: false
  codex_exec_sandbox: workspace-write
  codex_exec_network_access: false
  codex_exec_web_search: false
  codex_trace_to_optimizer: true
