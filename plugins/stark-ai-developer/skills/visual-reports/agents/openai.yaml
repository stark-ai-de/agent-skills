interface:
  display_name: "Visual Reports"
  short_description: "One topic per page, short bullets and supporting diagrams"
  icon_small: "./assets/openai-icon.png"
  icon_large: "./assets/openai-icon.png"
  default_prompt: "Use Visual Reports and prefer a suitable native interactive visualization; otherwise display the HTML report. Create a guided report with one topic visible at a time, a meaningful graphic above concise bullets, connected tabs, Back/Next navigation and a page count. Preserve essential conditions; keep optional sources and complete HTML/Markdown/JSON exports in a closed footer. Keep comparisons together, honor explicit layouts, and keep prototype and editor changes local."
policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: true
