<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSH terminal viewer</title>
    <link rel="stylesheet" href="/xterm.css" />
    <link rel="stylesheet" href="/viewer.css" />
  </head>
  <body>
    <main>
      <h1>SSH terminal viewer</h1>
      <form id="login">
        <label
          >Local bootstrap token
          <input id="token" type="password" autocomplete="off" required /></label
        ><label>Session ID <input id="session" autocomplete="off" required /></label
        ><button>Attach terminal</button>
      </form>
      <nav>
        <button id="writer" disabled>Acquire input</button
        ><button id="detach" disabled>Detach</button
        ><span id="status" role="status"
          >Enter a local agent or operator token and session ID.</span
        >
      </nav>
      <div id="terminal"></div>
      <p>
        Detaching keeps the terminal in the local service. Input requires the single writer lease.
      </p>
    </main>
    <script src="/xterm.js"></script>
    <script src="/fit.js"></script>
    <script src="/viewer.js"></script>
  </body>
</html>
