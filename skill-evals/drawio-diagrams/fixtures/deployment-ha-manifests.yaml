apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-api
spec:
  replicas: 4
  template:
    metadata:
      labels:
        app: example-api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: example-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-api
spec:
  rules:
    - host: api.example.invalid
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: primary-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: primary-data-backup
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: example.invalid/backup:1
              args: ["snapshot", "primary-data", "secondary-zone"]
