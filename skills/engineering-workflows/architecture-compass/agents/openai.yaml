interface:
  display_name: "Architecture Compass"
  short_description: "Governs and reviews ADR-guided architecture changes"
  icon_small: "./assets/openai-icon.png"
  icon_large: "./assets/openai-icon.png"
  default_prompt: "Use Architecture Compass to select and explain setup, audit, refactor, plan-refactor, or plan-run-refactor from this task; ask only when intent or authority is materially ambiguous. Preserve accepted decisions and protected state, use current host capabilities, reuse approval of unchanged content and write scope, and keep implementation and external actions within their own authority."
policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: true
