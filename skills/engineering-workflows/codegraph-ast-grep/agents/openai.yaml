interface:
  display_name: "CodeGraph + ast-grep"
  short_description: "Set up, update, or diagnose semantic and structural tooling"
  icon_small: "./assets/openai-icon.png"
  icon_large: "./assets/openai-icon.png"
  default_prompt: "Use $codegraph-ast-grep for my request. When intent, root, scope, and authority are clear, announce only the selected setup, update, or doctor workflow and its rationale, do not enumerate unselected workflows, and proceed. For a bare or materially ambiguous request or an explicit options request, show setup, update, and doctor in order and ask only when a choice is needed. An options-only request authorizes no repository or tool inspection and no execution. Preserve installer provenance and protected state, keep doctor non-repairing, require exact-root approval before graph diagnostics that may migrate metadata, and persist repository guidance after setup."
policy:
  products:
    - CODEX
  allow_implicit_invocation: false
