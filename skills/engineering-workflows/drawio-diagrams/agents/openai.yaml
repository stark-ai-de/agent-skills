  short_description: "Creates modern, verified, animated draw.io diagrams"
  default_prompt: "Use $drawio-diagrams to create or edit a modern, readable draw.io diagram. Use my requested design profile, adapt a supplied visual reference safely, or use the technical default; infer the audience and view, keep one abstraction level, preserve formal notation, use relevant logos or semantic icons for primary components and native flow animation unless I opt out, keep .drawio as the source of truth, validate it, and complete semantic, layout, and light/dark self-review."
