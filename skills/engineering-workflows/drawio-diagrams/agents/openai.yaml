interface:
  display_name: "Draw.io Diagrams"
  short_description: "Verified draw.io diagrams with capability-aware export"
  default_prompt: >-
    Use Draw.io Diagrams for this diagram task. Expose create, edit-repair, review,
    and export; after workflow and authority selection, run the capability preflight
    before any create/edit-repair/export inspection or mutation, while keeping review
    strictly read-only. Select and announce the task-matching route, inputs, outputs,
    profile, theme, animation, icon and authoring choices, write scope, protected
    files, approvals, fallback limitations, and the receipt fields Capability status,
    Renderer route, Tool-install approval, Cross-boundary approval, Export status,
    Visual verification, Evidence scope, and Fallback (used/offered). Prefer official
    organization/product/service icons or logos whenever available, preserve their
    original artwork and brand colors, and use labelled semantic icons only for
    generic or unresolved nodes. Do not recolor official marks unless the user asks
    explicitly or a necessary documented accessibility exception is disclosed.
policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: true
