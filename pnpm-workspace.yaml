packages:
  - "."
  - "site"
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Existing Astro transitive dependency; remove after Astro no longer resolves tinyexec@1.2.2.
  - tinyexec@1.2.2
allowBuilds:
  esbuild: true
  sharp: true
