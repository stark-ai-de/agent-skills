packages:
  - "."
  - "site"
overrides:
  "vite@": 8.2.2
  # github-actionlint still requests adm-zip 0.5; 0.6.1 fixes its archive advisories.
  "github-actionlint@1.7.12>adm-zip": 0.6.1
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
allowBuilds:
  esbuild: true
  sharp: true
