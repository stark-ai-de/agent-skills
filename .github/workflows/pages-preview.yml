name: GitHub Pages PR preview

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open same-repository pull request number
        required: true
        type: string
      source_sha:
        description: Exact 40-character head commit of that pull request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages-preview
  cancel-in-progress: false

jobs:
  build:
    # This reviewed file is mirrored into the separate preview repository.
    # Running it in the source repository must never replace production Pages.
    if: ${{ github.repository == 'stark-ai-de/agent-skills-preview' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the requested PR snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.pr }}
          PREVIEW_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          pr = os.environ["PREVIEW_PR"]
          sha = os.environ["PREVIEW_SHA"]
          if not re.fullmatch(r"[1-9][0-9]*", pr):
              raise SystemExit("Expected a positive PR number")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Expected an exact lowercase commit SHA")
          result = subprocess.run(
              ["gh", "api", f"repos/stark-ai-de/agent-skills/pulls/{pr}"],
              check=True, capture_output=True, text=True,
          )
          pull = json.loads(result.stdout)
          if (pull["state"] != "open"
              or pull["head"]["repo"]["full_name"] != "stark-ai-de/agent-skills"
              or pull["head"]["sha"] != sha):
              raise SystemExit("Preview requires the current head of an open same-repository PR")
          print(f"Verified PR #{pr} at {sha}")
          PY

      - name: Check out the pinned public source
        uses: actions/checkout@v6
        with:
          repository: stark-ai-de/agent-skills
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build and validate the preview
        env:
          AGENT_SKILLS_PREVIEW_PR: ${{ inputs.pr }}
          AGENT_SKILLS_PREVIEW_SHA: ${{ inputs.source_sha }}
        run: pnpm --filter ./site run build

      - name: Stage only the generated public site
        env:
          PREVIEW_PR: ${{ inputs.pr }}
          PREVIEW_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          pr = os.environ["PREVIEW_PR"]
          sha = os.environ["PREVIEW_SHA"]
          root = Path("preview-root")
          target = root / f"pr-{pr}"
          shutil.copytree("site/dist", target)
          receipt = {"pull_request": int(pr), "source_sha": sha,
                     "source_repository": "stark-ai-de/agent-skills",
                     "path": f"/agent-skills-preview/pr-{pr}/"}
          (root / "preview.json").write_text(json.dumps(receipt, indent=2) + "\n")
          (root / "robots.txt").write_text("User-agent: *\nDisallow: /\n")
          (root / "index.html").write_text(
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              '<meta name="robots" content="noindex, nofollow">'
              '<title>Agent Skills PR preview</title></head><body>'
              f'<h1>PR #{pr} preview</h1><p>Snapshot: <code>{sha}</code></p>'
              f'<p><a href="pr-{pr}/">Open the preview</a></p>'
              '<p>This site holds the latest manually requested preview only.</p>'
              '</body></html>\n'
          )
          PY

      - name: Upload the preview artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: preview-root

  deploy:
    needs: build
    if: ${{ github.repository == 'stark-ai-de/agent-skills-preview' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pr-${{ inputs.pr }}/
    steps:
      - name: Configure preview Pages
        uses: actions/configure-pages@v6

      - name: Deploy the preview repository
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summarize the live snapshot
        env:
          PREVIEW_PR: ${{ inputs.pr }}
          PREVIEW_SHA: ${{ inputs.source_sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            printf '### PR #%s preview\n\n' "$PREVIEW_PR"
            printf '[Open the preview](%spr-%s/)\n\n' "$PAGE_URL" "$PREVIEW_PR"
            printf 'Source commit: %s\n\n' "$PREVIEW_SHA"
            printf 'This separate Pages site does not publish the source repository or its packages.\n'
          } >> "$GITHUB_STEP_SUMMARY"
