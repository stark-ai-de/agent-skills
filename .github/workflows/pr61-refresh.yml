name: Refresh PR 61 generated docs

on:
  push:
    branches:
      - docs/hetzner-inference-setup-skill

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Add ADR index rows
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "docs/adrs.md";
          let text = fs.readFileSync(path, "utf8");

          const rows = [
            {
              id: "ADR-0047",
              after: "| [ADR-0034](adrs/0034-separate-package-manager-runtime-orchestration-and-hosting-decisions.short.md)",
              row: "| [ADR-0047](adrs/0047-use-a-local-litellm-gateway-for-hetzner-coding-clients.short.md) | Proposed | Use an isolated, pinned loopback LiteLLM gateway as the default client boundary, with direct Hetzner calls reserved for discovery, probes, or an explicitly verified direct lane. | [Long, canonical](adrs/0047-use-a-local-litellm-gateway-for-hetzner-coding-clients.long.md) | [Guide](adrs/0047-use-a-local-litellm-gateway-for-hetzner-coding-clients.guide.md) |",
            },
            {
              id: "ADR-0049",
              after: "| [ADR-0031](adrs/0031-use-approved-bounded-fixed-theme-rasterization.short.md)",
              row: "| [ADR-0049](adrs/0049-separate-hetzner-provider-and-local-gateway-credentials.short.md) | Proposed | Keep the upstream token behind the gateway, use a protected machine-local administrative gateway key, bind to loopback, and make rotation and cleanup explicit. | [Long, canonical](adrs/0049-separate-hetzner-provider-and-local-gateway-credentials.long.md) | [Guide](adrs/0049-separate-hetzner-provider-and-local-gateway-credentials.guide.md) |",
            },
            {
              id: "ADR-0048",
              after: "| [ADR-0036](adrs/0036-gate-oxc-adoption-on-repository-compatibility.short.md)",
              row: "| [ADR-0048](adrs/0048-implement-one-portable-hetzner-setup-skill-with-client-adapters.short.md) | Proposed | Keep one cross-platform setup workflow and isolate provider, gateway, client, credential, lifecycle, and operating-system differences behind explicit adapters. | [Long, canonical](adrs/0048-implement-one-portable-hetzner-setup-skill-with-client-adapters.long.md) | [Guide](adrs/0048-implement-one-portable-hetzner-setup-skill-with-client-adapters.guide.md) |",
            },
          ];

          for (const entry of rows) {
            if (text.includes(`| [${entry.id}](`)) {
              continue;
            }
            const start = text.indexOf(entry.after);
            if (start < 0) {
              throw new Error(`Missing insertion anchor for ${entry.id}`);
            }
            const end = text.indexOf("\n", start);
            if (end < 0) {
              throw new Error(`Unterminated insertion anchor for ${entry.id}`);
            }
            text = `${text.slice(0, end + 1)}${entry.row}\n${text.slice(end + 1)}`;
          }

          fs.writeFileSync(path, text);
          NODE

      - name: Format and validate ADRs
        run: |
          pnpm format
          pnpm format:check
          pnpm validate:adrs
          git diff --check

      - name: Commit generated result
        run: |
          git rm .github/workflows/pr61-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs(skills): refresh Hetzner setup specification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
