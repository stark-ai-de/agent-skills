name: Complete bounded Jev bundle metadata

on:
  push:
    branches: [codex/jev-portable-network-contract]

permissions:
  contents: write

concurrency:
  group: jev-bundle-metadata-once
  cancel-in-progress: false

jobs:
  metadata:
    if: ${{ github.repository == 'stark-ai-de/agent-skills' && github.ref == 'refs/heads/codex/jev-portable-network-contract' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.18.0
          cache: false
          install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - name: Apply required component identity, not a catalog release
        run: |
          python3 -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          def checked(path, expected):
              raw = Path(path).read_bytes()
              digest = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert digest == expected, 'source changed: ' + path
              return json.loads(raw)
          path = 'plugins/stark-ai-developer.source.json'
          data = checked(path, 'aca3b705783841e1420760c0408250c948ceb1d7')
          assert data['version'] == '1.7.0'
          assert data['outputs']['openaiArchive'] == 'dist/openai/stark-ai-developer-1.7.0.zip'
          data['version'] = '1.7.1'
          data['outputs']['openaiArchive'] = 'dist/openai/stark-ai-developer-1.7.1.zip'
          Path(path).write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          path = 'docs/listing/openai/stark-ai-developer.json'
          data = checked(path, '1f33bd0b2d692015305f47b7fa51190d7c8d7a11')
          assert data['plugin']['name'] == 'stark-ai-developer' and data['plugin']['version'] == '1.7.0'
          data['plugin']['version'] = '1.7.1'
          data['releaseNotes'] = 'Clarifies Jev API prerequisites and host-owned network authorization across native Windows, macOS, and Linux. Adds actionable, secret-free failure summaries, distinguishes native selection from Jev advice, and keeps complete opt-in hook guidance within Windows command limits. Adds offline platform tests without changing permissions, selection, transport, credentials, request budgets or automatic retry policy. Live provider and automatic host qualification remain separate.'
          Path(path).write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Format maintained metadata and regenerate canonical projections
        run: |
          pnpm exec oxfmt --write plugins/stark-ai-developer.source.json docs/listing/openai/stark-ai-developer.json
          pnpm run sync:agent-plugin
          pnpm run generate:openai-worksheet
      - name: Validate metadata, projections and feature release intent
        run: |
          pnpm run validate:release-descriptor
          pnpm run validate:projections
          pnpm run validate:bundles
          pnpm run validate:openai
          pnpm run release:intent -- --base-ref 23c817f460704ece44c035eada1b7a2b030dc6a1
          git diff --check
      - name: Publish only allowlisted metadata to the implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 -B - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'stark-ai-de/agent-skills'
          branch = 'codex/jev-portable-network-contract'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          expected = os.environ['EXPECTED_HEAD']
          allowed = {
              'plugins/stark-ai-developer.source.json',
              'docs/listing/openai/stark-ai-developer.json',
              'docs/listing/openai/stark-ai-developer-submission-worksheet.md',
              'plugins/stark-ai-developer/plugin.json',
              'plugins/stark-ai-developer/SOURCE-MANIFEST.json',
              'plugins/stark-ai-developer/README.md',
              '.agents/plugins/marketplace.json',
          }
          names = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')))
          assert names and names <= allowed, 'unexpected generated changes: ' + repr(sorted(names - allowed))
          assert not subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard']), 'unexpected untracked files'
          def api(route, data=None, method=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + route,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'User-Agent': 'bounded-component-metadata'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          assert api('/git/ref/heads/' + branch)['object']['sha'] == expected, 'branch moved'
          parent = api('/git/commits/' + expected)
          entries = []
          for name in sorted(names):
              p = Path(name)
              assert p.is_file() and not p.is_symlink()
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name]).decode().split()[0]
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'content': p.read_text(encoding='utf-8')})
          tree = api('/git/trees', {'base_tree': parent['tree']['sha'], 'tree': entries})
          commit = api('/git/commits', {'message': 'fix(release): version changed Jev bundle and listing as 1.7.1', 'tree': tree['sha'], 'parents': [expected]})
          assert api('/git/ref/heads/' + branch)['object']['sha'] == expected, 'branch moved before update'
          api('/git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False}, 'PATCH')
          print('Recorded metadata commit:', commit['sha'])
          print('Files:', ', '.join(sorted(names)))
          PY
