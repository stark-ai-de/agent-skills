name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - .bun-version
      - bunfig.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - incubator/**
      - skill-evals/**
      - site/**
      - skills/**

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: 🟢 Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0
          cache: true
          install: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 🏗️ Build catalog site
        run: pnpm --filter ./site run build

      - name: ⚙️ Configure Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v6

      - name: 📤 Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - name: 🧭 Summarize build
        if: ${{ always() }}
        uses: ./.github/actions/write-run-summary
        with:
          title: GitHub Pages build
          success: Review the build; deployment runs only for a successful main-branch run.
          failure: Fix the site build or dependency failure, then push a correction or rerun.

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Checkout workflow helpers
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 🧭 Summarize deployment
        if: ${{ always() }}
        uses: ./.github/actions/write-run-summary
        with:
          title: GitHub Pages deployment
          success: Open the published Pages URL, then complete docs/publishing.md#operator-follow-up (After GitHub Pages deploy).
          failure: Inspect Pages permissions or deployment output, then rerun after correction.
