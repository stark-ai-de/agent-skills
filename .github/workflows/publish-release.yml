name: Publish Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without creating a tag or GitHub Release
        required: true
        default: true
        type: boolean
      mark_latest:
        description: Mark the GitHub Release as latest
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.version.outputs.release_sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful hosted Validate run
        id: validate-receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
        run: |
          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow validate.yml \
            --commit "$RELEASE_SHA" \
            --status completed \
            --limit 50 \
            --json databaseId,status,conclusion \
            --jq 'map(select(.status == "completed" and .conclusion == "success")) | .[0].databaseId // empty')

          if [ -z "$run_id" ]; then
            echo "No successful Validate run exists for ${RELEASE_SHA}; wait for main validation and retry."
            exit 1
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Reusing successful Validate run ${run_id} for ${RELEASE_SHA}."

      - run: node scripts/validate-release.mjs

      - run: node scripts/print-release-notes.mjs > release-notes.md

      - name: Print release readiness
        run: |
          echo "Release readiness dry run passed for v${{ steps.version.outputs.version }} using Validate run ${{ steps.validate-receipt.outputs.run_id }}."
          echo "Actual tag and GitHub Release creation only run from manual dispatch with dry_run=false."

  publish:
    needs: release-readiness
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-readiness.outputs.release_sha }}
          fetch-depth: 0

      # release-readiness already validated this immutable SHA; publish only verifies and publishes it.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify validated release identity
        env:
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(node -p "require('./package.json').version")" = "${VERSION}"

          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "${main_sha}" != "${RELEASE_SHA}" ]; then
            echo "main advanced after release readiness; rerun the workflow."
            exit 1
          fi

      - name: Verify tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          tag="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists."
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
            exit 1
          fi

      - name: Build release notes
        run: node scripts/print-release-notes.mjs > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          tag="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${RELEASE_SHA}" -m "${tag}"
          git push origin "${tag}"

          latest_flag=("--latest=false")
          if [ "${{ inputs.mark_latest }}" = "true" ]; then
            latest_flag=("--latest")
          fi

          gh release create "${tag}" \
            --verify-tag \
            --title "${tag}" \
            --notes-file release-notes.md \
            "${latest_flag[@]}"

      - name: Print post-release verification
        run: |
          echo "After publishing, verify:"
          echo "npx skills@latest add stark-ai-de/agent-skills --list"
          echo "env -u DISABLE_TELEMETRY -u DO_NOT_TRACK npx skills@latest add stark-ai-de/agent-skills --skill codegraph-ast-grep codex-spec-interviewer codex-memory-curator architecture-compass drawio-diagrams animated-readme-logo -a codex --copy -y"
          echo "env -u DISABLE_TELEMETRY -u DO_NOT_TRACK npx skills@latest add stark-ai-de/agent-skills --skill cursor-spec-interviewer cursor-memory-curator codegraph-ast-grep architecture-compass drawio-diagrams animated-readme-logo -a cursor --copy -y"
          echo "env -u DISABLE_TELEMETRY -u DO_NOT_TRACK npx skills@latest add stark-ai-de/agent-skills --skill claude-spec-interviewer claude-memory-curator codegraph-ast-grep architecture-compass drawio-diagrams animated-readme-logo -a claude-code --copy -y"
          echo "gh release view v${{ needs.release-readiness.outputs.version }} -R stark-ai-de/agent-skills"
