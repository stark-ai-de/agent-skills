name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - .release-please-manifest.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without creating a tag or GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  attestations: read
  pull-requests: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publication-trigger:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ github.sha }}
      release_candidate: ${{ steps.release-intent.outputs.contract_kind == 'release-pr' && steps.release-provenance.outputs.authorized == 'true' }}
      release_pull_request: ${{ steps.release-provenance.outputs.pull_request }}
      readiness_required: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) || (steps.release-intent.outputs.contract_kind == 'release-pr' && steps.release-provenance.outputs.authorized == 'true') }}
    timeout-minutes: 5

    steps:
      - name: ⬇️ Checkout publication candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: 🔏 Verify configured Release Please App provenance
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        id: release-provenance
        env:
          EXPECTED_APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/verify-release-please-merge.mjs
          --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA"
          --expected-app-id "$EXPECTED_APP_ID"
          --allow-unmatched
          --github-output

      - name: 🧭 Require a generated release-PR transition
        id: release-intent
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PROVENANCE_AUTHORIZED: ${{ steps.release-provenance.outputs.authorized }}
          TRANSITION_BASE: ${{ steps.release-provenance.outputs.transition_base }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          base_sha="${BEFORE_SHA}"
          if [ "${PROVENANCE_AUTHORIZED}" = "true" ]; then
            base_sha="${TRANSITION_BASE}"
            test "${EVENT_NAME}" != "push" || test "${base_sha}" = "${BEFORE_SHA}"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            base_sha=$(git rev-parse HEAD^1)
          else
            test "${base_sha}" != "0000000000000000000000000000000000000000"
          fi
          test -n "${base_sha}"
          git cat-file -e "${base_sha}^{commit}" 2>/dev/null || \
            git fetch --no-tags --depth=1 origin "${base_sha}"
          npm run release:intent -- \
            --base-ref "${base_sha}" \
            --head-ref "${GITHUB_SHA}" \
            --github-output

      - name: 🚫 Reject a manual mutating non-release candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && steps.release-provenance.outputs.authorized != 'true' }}
        run: |
          echo "Manual publication requires main HEAD to be a generated release-PR merge."
          exit 1

      - name: 🚫 Reject unauthorized root release metadata
        if: ${{ steps.release-intent.outputs.contract_kind == 'release-pr' && steps.release-provenance.outputs.authorized != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: |
          echo "Root release metadata requires the configured Release Please App-owned PR."
          exit 1

      - name: 🧭 Summarize publication trigger
        run: |
          echo "Readiness required: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) || (steps.release-intent.outputs.contract_kind == 'release-pr' && steps.release-provenance.outputs.authorized == 'true') }}"
          echo "Mutation candidate: ${{ steps.release-intent.outputs.contract_kind == 'release-pr' && steps.release-provenance.outputs.authorized == 'true' }}"

  release-readiness:
    needs: publication-trigger
    if: ${{ needs.publication-trigger.outputs.readiness_required == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      validate_run_id: ${{ steps.validate-receipt.outputs.run_id }}
      plugin_version: ${{ steps.subject-identity.outputs.plugin_version }}

    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout exact publication candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.publication-trigger.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 🟢 Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0
          cache: true
          install: false

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 🏷️ Read release identity
        id: version
        env:
          CANDIDATE_SHA: ${{ needs.publication-trigger.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          release_sha=$(git rev-parse HEAD)
          expected_ref="refs/heads/main"
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml@${expected_ref}"

          test -z "$(git status --porcelain --untracked-files=all)"
          test "${GITHUB_REF}" = "${expected_ref}"
          test "${WORKFLOW_REF}" = "${expected_workflow_ref}"
          test "${WORKFLOW_SHA}" = "${release_sha}"
          test "${GITHUB_SHA}" = "${release_sha}"
          test "${CANDIDATE_SHA}" = "${release_sha}"

          node scripts/release/verify-main-release-candidate.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --candidate "${release_sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - name: 🔗 Require successful hosted Validate run
        id: validate-receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
        run: |
          deadline=$((SECONDS + 1500))
          run_id=""

          while true; do
            runs=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow validate.yml \
              --commit "$RELEASE_SHA" \
              --branch main \
              --limit 50 \
              --json databaseId,status,conclusion,event,headBranch)

            run_id=$(printf '%s' "$runs" | jq -r \
              'map(select(.event == "push" and .headBranch == "main" and .status == "completed" and .conclusion == "success")) | .[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              break
            fi

            pending=$(printf '%s' "$runs" | jq -r \
              '[.[] | select(.event == "push" and .headBranch == "main" and (.status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending" or .status == "in_progress"))] | length')
            failed=$(printf '%s' "$runs" | jq -r \
              '[.[] | select(.event == "push" and .headBranch == "main" and .status == "completed" and .conclusion != "success")] | length')

            if [ "$failed" != "0" ] && [ "$pending" = "0" ]; then
              echo "Validate completed without success for ${RELEASE_SHA}."
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "No successful Validate run exists for ${RELEASE_SHA}; wait for main validation and retry."
              exit 1
            fi

            echo "Waiting for Validate on ${RELEASE_SHA} (pending=${pending})."
            sleep 20
          done

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Reusing successful Validate run ${run_id} for ${RELEASE_SHA}."

      - name: 🚀 Validate release contract
        run: npm run release:validate

      - name: ⬇️ Download hosted OpenAI subject
        uses: actions/download-artifact@v8
        with:
          name: openai.zip
          repository: ${{ github.repository }}
          run-id: ${{ steps.validate-receipt.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-subjects
          skip-decompress: true

      - name: ⬇️ Download hosted portable subject
        uses: actions/download-artifact@v8
        with:
          name: portable.zip
          repository: ${{ github.repository }}
          run-id: ${{ steps.validate-receipt.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-subjects
          skip-decompress: true

      - name: ⬇️ Download hosted release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-subject.json
          repository: ${{ github.repository }}
          run-id: ${{ steps.validate-receipt.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-subjects
          skip-decompress: true

      - name: 🔐 Verify hosted release subjects
        id: subject-identity
        env:
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          plugin_version=$(node --input-type=module -e 'import { pluginIdentity } from "./scripts/lib/release-descriptor.mjs"; console.log(pluginIdentity(process.cwd()).version)')
          archive_profile=$(node --input-type=module -e 'import { pluginIdentity } from "./scripts/lib/release-descriptor.mjs"; console.log(pluginIdentity(process.cwd()).archiveProfile)')
          node scripts/release/validate-release-subject.mjs \
            --directory release-subjects \
            --source-revision "${RELEASE_SHA}" \
            --release-version "${VERSION}" \
            --plugin-version "${plugin_version}" \
            --archive-profile "${archive_profile}" \
            --source-state clean \
            --status pass
          echo "plugin_version=${plugin_version}" >> "$GITHUB_OUTPUT"

      - name: 📝 Build release notes
        run: node scripts/release/print-release-notes.mjs > release-notes.md

      - name: 🧭 Plan GitHub Release reconciliation
        id: reconciliation-plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/reconcile-github-release.mjs plan \
            --repository "$GITHUB_REPOSITORY" \
            --tag "v${VERSION}" \
            --release-sha "${RELEASE_SHA}" \
            --subjects-dir release-subjects \
            --notes-file release-notes.md \
            --github-output "$GITHUB_OUTPUT"

      - name: 📣 Print release readiness
        run: |
          echo "Release readiness dry run passed for v${{ steps.version.outputs.version }} using Validate run ${{ steps.validate-receipt.outputs.run_id }}."
          echo "Release reconciliation plan: ${{ steps.reconciliation-plan.outputs.status }} (${{ steps.reconciliation-plan.outputs.reason }})."
          echo "Remote mutation runs only in the protected release environment after an automatic release-PR merge or manual dry_run=false dispatch."

      - name: 🧭 Summarize readiness
        if: ${{ always() }}
        uses: ./.github/actions/write-run-summary
        with:
          title: Release readiness
          success: Hosted subjects verified. The write-capable job now waits for release-environment approval unless this was a read-only dry run. Operator follow-up is docs/publishing.md#operator-follow-up.
          failure: Fix the failed readiness gate; do not create a tag or GitHub Release.

  publish:
    needs: [publication-trigger, release-readiness]
    if: ${{ needs.publication-trigger.outputs.release_candidate == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: ⬇️ Checkout validated SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-readiness.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 🛡️ Verify protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/check-release-environment.mjs
          --repository "$GITHUB_REPOSITORY"
          --environment release
          --branch main

      - name: 🔍 Verify validated release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/main"
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml@${expected_ref}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(node -p "require('./package.json').version")" = "${VERSION}"
          test "${GITHUB_SHA}" = "${RELEASE_SHA}"
          test "${GITHUB_REF}" = "${expected_ref}"
          test "${WORKFLOW_REF}" = "${expected_workflow_ref}"
          test "${WORKFLOW_SHA}" = "${RELEASE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          node --input-type=module -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (!/^\d+\.\d+\.\d+$/.test(process.argv[1]) || major < 0 || (major === 0 && minor < 21)) {
              throw new Error("Publication mutation supports only v0.21.0 and newer releases");
            }
          ' "${VERSION}"

          node scripts/release/verify-main-release-candidate.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --candidate "${RELEASE_SHA}"

      # release-readiness already validated this immutable SHA; publish only verifies and publishes it.
      - name: 🟢 Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0
          cache: false
          install: false

      - name: 📦 Install receipt validation dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: ⬇️ Download hosted OpenAI subject
        uses: actions/download-artifact@v8
        with:
          name: openai.zip
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-readiness.outputs.validate_run_id }}
          github-token: ${{ github.token }}
          path: release-subjects
          skip-decompress: true

      - name: ⬇️ Download hosted portable subject
        uses: actions/download-artifact@v8
        with:
          name: portable.zip
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-readiness.outputs.validate_run_id }}
          github-token: ${{ github.token }}
          path: release-subjects
          skip-decompress: true

      - name: ⬇️ Download hosted release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-subject.json
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-readiness.outputs.validate_run_id }}
          github-token: ${{ github.token }}
          path: release-subjects
          skip-decompress: true

      - name: 🔐 Verify release subjects before publication
        id: subject-identity
        env:
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          set -euo pipefail
          plugin_version=$(node --input-type=module -e 'import { pluginIdentity } from "./scripts/lib/release-descriptor.mjs"; console.log(pluginIdentity(process.cwd()).version)')
          archive_profile=$(node --input-type=module -e 'import { pluginIdentity } from "./scripts/lib/release-descriptor.mjs"; console.log(pluginIdentity(process.cwd()).archiveProfile)')
          node scripts/release/validate-release-subject.mjs \
            --directory release-subjects \
            --source-revision "${RELEASE_SHA}" \
            --release-version "${VERSION}" \
            --plugin-version "${plugin_version}" \
            --archive-profile "${archive_profile}" \
            --source-state clean \
            --status pass
          echo "plugin_version=${plugin_version}" >> "$GITHUB_OUTPUT"

      - name: 📝 Build release notes
        run: node scripts/release/print-release-notes.mjs > release-notes.md

      - name: 🧭 Recheck GitHub Release reconciliation
        id: reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/reconcile-github-release.mjs plan \
            --repository "$GITHUB_REPOSITORY" \
            --tag "v${VERSION}" \
            --release-sha "${RELEASE_SHA}" \
            --subjects-dir release-subjects \
            --notes-file release-notes.md \
            --github-output "$GITHUB_OUTPUT"

      - name: 🔏 Attest release subjects
        if: ${{ steps.reconciliation.outputs.requires_attestation == 'true' && steps.reconciliation.outputs.release_published != 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            release-subjects/openai.zip
            release-subjects/portable.zip

      - name: 🔎 Verify release attestations
        if: ${{ steps.reconciliation.outputs.attestation_verification_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
        run: |
          set -euo pipefail
          for archive in release-subjects/openai.zip release-subjects/portable.zip; do
            gh attestation verify "$archive" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-release.yml" \
              --signer-digest "$RELEASE_SHA" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$RELEASE_SHA" \
              --source-ref refs/heads/main \
              --format json \
              > "${archive%.zip}.attestation.json"
          done

      - name: 🧾 Write pre-publication receipt
        if: ${{ steps.reconciliation.outputs.release_published != 'true' }}
        env:
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-release.yml
          SIGNER_DIGEST: ${{ needs.release-readiness.outputs.release_sha }}
          SOURCE_REF: refs/heads/main
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          openai_sha=$(sha256sum release-subjects/openai.zip | awk '{print $1}')
          portable_sha=$(sha256sum release-subjects/portable.zip | awk '{print $1}')
          openai_bytes=$(stat -c '%s' release-subjects/openai.zip)
          portable_bytes=$(stat -c '%s' release-subjects/portable.zip)

          RECEIPT_TAG="${tag}" \
            SOURCE_COMMIT="${RELEASE_SHA}" \
            REPOSITORY="${GITHUB_REPOSITORY}" \
            OPENAI_SHA="${openai_sha}" \
            PORTABLE_SHA="${portable_sha}" \
            OPENAI_BYTES="${openai_bytes}" \
            PORTABLE_BYTES="${portable_bytes}" \
            node scripts/release/render-post-release-receipt.mjs \
              --render pre_release_archive \
              --file pre-release-receipt.json

      - name: 🔍 Validate pre-publication receipt
        if: ${{ steps.reconciliation.outputs.release_published != 'true' }}
        run: node scripts/release/validate-post-release-receipt.mjs --file pre-release-receipt.json

      - name: ⬆️ Upload pre-publication evidence
        if: ${{ steps.reconciliation.outputs.release_published != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: pre-release-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: 🚀 Apply GitHub Release reconciliation
        id: reconciliation-apply
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_ENVIRONMENT: release
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/reconcile-github-release.mjs apply \
            --repository "$GITHUB_REPOSITORY" \
            --tag "v${VERSION}" \
            --release-sha "${RELEASE_SHA}" \
            --subjects-dir release-subjects \
            --notes-file release-notes.md \
            --github-output "$GITHUB_OUTPUT"

      - name: 🧾 Dispatch post-release evidence
        if: ${{ always() && steps.reconciliation-apply.outputs.post_release_dispatch_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run post-release-evidence.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=v${VERSION}"

      - name: 🔑 Create release-label lifecycle token
        id: release-label-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: 🏷️ Complete the generated release-PR lifecycle
        env:
          APP_SLUG: ${{ steps.release-label-token.outputs.app-slug }}
          EXPECTED_APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          GH_TOKEN: ${{ steps.release-label-token.outputs.token }}
          RELEASE_PULL_REQUEST: ${{ needs.publication-trigger.outputs.release_pull_request }}
        run: |
          set -euo pipefail
          test "$(gh api "apps/${APP_SLUG}" --jq '.id')" = "${EXPECTED_APP_ID}"
          labels=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PULL_REQUEST}" \
            --jq '[.labels[].name]')
          pending=$(printf '%s' "${labels}" | jq 'index("autorelease: pending") != null')
          tagged=$(printf '%s' "${labels}" | jq 'index("autorelease: tagged") != null')
          if [ "${pending}" != "true" ] && [ "${tagged}" != "true" ]; then
            echo "Generated release PR has neither the pending nor tagged lifecycle label."
            exit 1
          fi
          if [ "${tagged}" != "true" ]; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PULL_REQUEST}/labels" \
              -f 'labels[]=autorelease: tagged' >/dev/null
          fi
          if [ "${pending}" = "true" ]; then
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PULL_REQUEST}/labels/autorelease%3A%20pending" \
              >/dev/null
          fi

      - name: 📣 Print post-release verification
        run: |
          echo "Complete operator follow-up in docs/publishing.md#operator-follow-up."
          echo "Post-release evidence dispatch required: ${{ steps.reconciliation-apply.outputs.post_release_dispatch_required }}"
          echo "gh release view v${{ needs.release-readiness.outputs.version }} -R stark-ai-de/agent-skills"

      - name: 🧭 Summarize publication
        if: ${{ always() }}
        uses: ./.github/actions/write-run-summary
        with:
          title: GitHub Release publication
          success: Inspect the dispatched Post-release Evidence run, then complete docs/publishing.md#operator-follow-up.
          failure: No release hand-off is complete; inspect the failed gate and rerun after correction.
