name: Publish Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without creating a tag or GitHub Release
        required: true
        default: true
        type: boolean
      mark_latest:
        description: Mark the GitHub Release as latest
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      validate_run_id: ${{ steps.validate-receipt.outputs.run_id }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - run: pnpm install --frozen-lockfile

      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful hosted Validate run
        id: validate-receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
        run: |
          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow validate.yml \
            --commit "$RELEASE_SHA" \
            --branch main \
            --event push \
            --status success \
            --limit 50 \
            --json databaseId,status,conclusion,event,headBranch,headSha \
            --jq 'map(select(.status == "completed" and .conclusion == "success" and .event == "push" and .headBranch == "main" and .headSha == env.RELEASE_SHA)) | .[0].databaseId // empty')

          if [ -z "$run_id" ]; then
            echo "No successful main push Validate run exists for $RELEASE_SHA; wait for main validation and retry."
            exit 1
          fi

          artifact_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            --jq '.artifacts | map(select(.name == "validation-receipt" and .expired == false)) | .[0].id // empty')

          if [ -z "$artifact_id" ]; then
            echo "Validate run has no unexpired validation receipt."
            exit 1
          fi

          artifact_metadata=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
            --jq '[.workflow_run.id, .workflow_run.head_sha, .workflow_run.head_branch] | @tsv')
          IFS=$'\t' read -r artifact_run_id artifact_sha artifact_branch <<< "$artifact_metadata"
          test "$artifact_run_id" = "$run_id"
          test "$artifact_sha" = "$RELEASE_SHA"
          test "$artifact_branch" = "main"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Reusing successful main push Validate run $run_id for $RELEASE_SHA."

      - name: Download validation receipt
        uses: actions/download-artifact@v4
        with:
          name: validation-receipt
          path: validation-receipt
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.validate-receipt.outputs.run_id }}

      - name: Verify validation receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
          VERSION: ${{ steps.version.outputs.version }}
          VALIDATE_RUN_ID: ${{ steps.validate-receipt.outputs.run_id }}
        run: |
          test -f validation-receipt/validation-receipt.json
          test "$(jq -r '.workflow' validation-receipt/validation-receipt.json)" = "Validate"
          test "$(jq -r '.workflow_path' validation-receipt/validation-receipt.json)" = ".github/workflows/validate.yml"
          test "$(jq -r '.run_id' validation-receipt/validation-receipt.json)" = "$VALIDATE_RUN_ID"
          test "$(jq -r '.run_attempt | tonumber > 0' validation-receipt/validation-receipt.json)" = "true"
          test "$(jq -r '.event' validation-receipt/validation-receipt.json)" = "push"
          test "$(jq -r '.branch' validation-receipt/validation-receipt.json)" = "main"
          test "$(jq -r '.sha' validation-receipt/validation-receipt.json)" = "$RELEASE_SHA"
          test "$(jq -r '.version' validation-receipt/validation-receipt.json)" = "$VERSION"
          site_digest=$(jq -r '.site_digest' validation-receipt/validation-receipt.json)
          pages_artifact_id=$(jq -r '.pages_artifact_id' validation-receipt/validation-receipt.json)
          test "$site_digest" != "null"
          test -n "$site_digest"
          test "$pages_artifact_id" != "null"
          test -n "$pages_artifact_id"

          pages_artifact_metadata=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$pages_artifact_id" \
            --jq '[.name, .expired, .workflow_run.id, .workflow_run.head_sha, .workflow_run.head_branch] | @tsv')
          IFS=$'\t' read -r pages_artifact_name pages_artifact_expired pages_run_id pages_sha pages_branch <<< "$pages_artifact_metadata"
          test "$pages_artifact_name" = "github-pages"
          test "$pages_artifact_expired" = "false"
          test "$pages_run_id" = "$VALIDATE_RUN_ID"
          test "$pages_sha" = "$RELEASE_SHA"
          test "$pages_branch" = "main"

          echo "Validated Pages artifact $pages_artifact_id belongs to Validate run $VALIDATE_RUN_ID."
          echo "Validated site digest: $site_digest"

      - run: node scripts/validate-release.mjs

      - run: node scripts/print-release-notes.mjs > release-notes.md

      - name: Print release readiness
        run: |
          echo "Release readiness dry run passed for v${{ steps.version.outputs.version }} using validated main push run ${{ steps.validate-receipt.outputs.run_id }}."
          echo "Actual tag and GitHub Release creation only run from manual dispatch with dry_run=false."

  publish:
    needs: release-readiness
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-readiness.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify validated release identity
        env:
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "$VERSION"

          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main_sha" != "$RELEASE_SHA" ]; then
            echo "main advanced after release readiness; rerun the workflow."
            exit 1
          fi

      - name: Verify tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          tag="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
            exit 1
          fi

      - name: Build release notes
        run: node scripts/print-release-notes.mjs > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
          VERSION: ${{ needs.release-readiness.outputs.version }}
        run: |
          tag="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$RELEASE_SHA" -m "$tag"
          git push origin "$tag"

          latest_flag=("--latest=false")
          if [ "${{ inputs.mark_latest }}" = "true" ]; then
            latest_flag=("--latest")
          fi

          gh release create "$tag" \
            --verify-tag \
            --title "$tag" \
            --notes-file release-notes.md \
            "${latest_flag[@]}"

      - name: Print post-release verification
        run: |
          echo "After publishing, verify:"
          echo "npx skills@latest add stark-ai-de/agent-skills --list"
          echo "env -u DISABLE_TELEMETRY -u DO_NOT_TRACK npx skills@latest add stark-ai-de/agent-skills --skill codegraph-ast-grep codex-spec-interviewer codex-memory-curator architecture-compass drawio-diagrams animated-readme-logo -a codex --copy -y"
          echo "env -u DISABLE_TELEMETRY -u DO_NOT_TRACK npx skills@latest add stark-ai-de/agent-skills --skill cursor-spec-interviewer cursor-memory-curator codegraph-ast-grep architecture-compass drawio-diagrams animated-readme-logo -a cursor --copy -y"
          echo "env -u DISABLE_TELEMETRY -u DO_NOT_TRACK npx skills@latest add stark-ai-de/agent-skills --skill claude-spec-interviewer claude-memory-curator codegraph-ast-grep architecture-compass drawio-diagrams animated-readme-logo -a claude-code --copy -y"
          echo "gh release view v${{ needs.release-readiness.outputs.version }} -R stark-ai-de/agent-skills"
