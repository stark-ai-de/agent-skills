name: PR 141 temporary validation workspace

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/pr141-workspace-export.yml

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.event.pull_request.number == 141 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.18.0
          cache: true
          install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Prepare isolated worktree
        run: git worktree add --detach .worktrees/agent-skills-worktrees/pr141 HEAD
      - name: Prepare source and pinned validation tooling
        working-directory: .worktrees/agent-skills-worktrees/pr141
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          mkdir -p "$RUNNER_TEMP/pr141-workspace/tools/bin"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/pr141-workspace/source.tar.gz"
          tar -czf "$RUNNER_TEMP/pr141-workspace/dependencies.tar.gz" node_modules site/node_modules
          cp -L "$(node -p process.execPath)" "$RUNNER_TEMP/pr141-workspace/tools/bin/node"
          cp -L "$(command -v bun)" "$RUNNER_TEMP/pr141-workspace/tools/bin/bun"
          PNPM_REAL="$(realpath "$(command -v pnpm)")"
          mkdir -p "$RUNNER_TEMP/pr141-workspace/tools/pnpm"
          cp -a "$(dirname "$PNPM_REAL")/." "$RUNNER_TEMP/pr141-workspace/tools/pnpm/"
          printf '%s\n' "$(basename "$PNPM_REAL")" > "$RUNNER_TEMP/pr141-workspace/tools/pnpm-entry.txt"
          tar -czf "$RUNNER_TEMP/pr141-workspace/tools.tar.gz" -C "$RUNNER_TEMP/pr141-workspace" tools
          rm -r "$RUNNER_TEMP/pr141-workspace/tools"
          git rev-parse HEAD > "$RUNNER_TEMP/pr141-workspace/source-revision.txt"
          sha256sum "$RUNNER_TEMP/pr141-workspace/"*.tar.gz > "$RUNNER_TEMP/pr141-workspace/SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: pr141-validation-workspace
          path: ${{ runner.temp }}/pr141-workspace/
          retention-days: 1
          if-no-files-found: error
