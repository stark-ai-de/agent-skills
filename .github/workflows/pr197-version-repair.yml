name: PR 197 component version repair

on:
  push:
    branches: [codex/lens-debug-skill]
    paths: [.github/workflows/pr197-version-repair.yml]

permissions: {}

jobs:
  prepare:
    if: github.repository == 'stark-ai-de/agent-skills' && github.ref == 'refs/heads/codex/lens-debug-skill'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          runtime: node@24.18.0
          cache: false
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install pinned verification dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply reviewed patch versions and regenerate projections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 4365eaeea698ea41f61673a780f2ed033ca76f13
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          expected = {
              'docs/assets/chatgpt-plugin-badge.svg': '025753cc46a22876fd072e351a11582bbfa7c332942f91fd287e3d7ceb036d50',
              'docs/listing/openai/stark-ai-developer.json': 'fe9ce5e2736abddfaf2fccd80b62caa8175921db535802214e97a930e6bd7fc5',
              'incubator/skills/engineering-workflows/lens-debug/SKILL.md': '2c6bd28a2792667b3ebe2a0c5d0e4ff563d55c734146b37d7feea306bf23dc7b',
              'plugins/stark-ai-developer.source.json': '6629f731db92b223e255db08d0a55a529cf771ccab141a4a7a65343fb9984931',
              'plugins/stark-ai-developer/SOURCE-MANIFEST.json': '2aa4512172c224eee67a074517a12db1fadb4b5b3e32f9a04410e876d1b547eb',
              'plugins/stark-ai-developer/plugin.json': '6558b277e39aa868309b632fe12d3c536d9231a260dc0ac5d142e1d89fd9b3d9',
              'plugins/stark-ai-developer/skills/architecture-compass/SKILL.md': '78c1414471b0a2d6e86a0bf3eeb305795a8ac2fcc67c88b1cf7d02db4926bff1',
              'plugins/stark-ai-developer/skills/codex-memory-curator/SKILL.md': '859a2099fcd6e1212051370202b56e78f17e45092cd8f5bb4aad83bd9e7fd0f7',
              'plugins/stark-ai-developer/skills/jev-capability-advisor/SKILL.md': '7199e17bd6887b428b37198d6db4a91b6520251e8b8378c77f142efbefb29d8a',
              'skill-evals/architecture-zoom/public-admission.json': 'c3c5fba01e66e7f75ec0060a52467e14998e06b072b2f87af9273272ebc600ce',
              'skills/claude-operations/claude-memory-curator/SKILL.md': '32e93361655e49bfb766523d7ee3c4caec6ec36378fba3b958a4f90e63711ddc',
              'skills/codex-operations/codex-memory-curator/SKILL.md': '859a2099fcd6e1212051370202b56e78f17e45092cd8f5bb4aad83bd9e7fd0f7',
              'skills/engineering-workflows/architecture-compass/SKILL.md': '78c1414471b0a2d6e86a0bf3eeb305795a8ac2fcc67c88b1cf7d02db4926bff1',
              'skills/skill-maintenance/jev-capability-advisor/SKILL.md': '7199e17bd6887b428b37198d6db4a91b6520251e8b8378c77f142efbefb29d8a',
          }
          versions = {
              'skills/claude-operations/claude-memory-curator/SKILL.md': ('0.2.2', '0.2.3'),
              'skills/codex-operations/codex-memory-curator/SKILL.md': ('0.2.4', '0.2.5'),
              'skills/engineering-workflows/architecture-compass/SKILL.md': ('0.13.1', '0.13.2'),
              'skills/skill-maintenance/jev-capability-advisor/SKILL.md': ('0.3.3', '0.3.4'),
          }
          for relative, (old, new) in versions.items():
              path = Path(relative)
              text = path.read_text()
              needle = f'  version: "{old}"'
              assert text.count(needle) == 1, relative
              path.write_text(text.replace(needle, f'  version: "{new}"', 1))
          path = Path('incubator/skills/engineering-workflows/lens-debug/SKILL.md')
          text = path.read_text()
          assert text.count('metadata:\n  internal: true') == 1
          path.write_text(text.replace('metadata:\n  internal: true', 'metadata:\n  internal: true\n  version: "0.1.0"', 1))
          source = Path('plugins/stark-ai-developer.source.json')
          data = json.loads(source.read_text())
          assert data['version'] == '1.23.1'
          data['version'] = '1.23.2'
          for profile, old, new in [('existing-remote', '2.0.0', '2.0.1'), ('new-remote', '1.4.0', '1.4.1'), ('desktop-local', '1.0.0', '1.0.1')]:
              assert data['openai']['profiles'][profile]['version'] == old
              data['openai']['profiles'][profile]['version'] = new
          assert data['outputs']['openaiArchive'] == 'dist/openai/stark-ai-developer-tools-1.4.0.zip'
          data['outputs']['openaiArchive'] = 'dist/openai/stark-ai-developer-tools-1.4.1.zip'
          source.write_text(json.dumps(data, indent=2) + '\n')
          listing = Path('docs/listing/openai/stark-ai-developer.json')
          data = json.loads(listing.read_text())
          assert data['plugin']['version'] == '1.23.1'
          data['plugin']['version'] = '1.23.2'
          listing.write_text(json.dumps(data, indent=2) + '\n')
          badge = Path('docs/assets/chatgpt-plugin-badge.svg')
          text = badge.read_text()
          assert text.count('1.23.1') == 3
          badge.write_text(text.replace('1.23.1', '1.23.2'))
          formatter = ['node_modules/.bin/oxfmt', '--config', 'oxfmt.json', '--ignore-path', '.oxfmtignore', '--threads=1', '--write']
          subprocess.run(formatter + [str(source), str(listing)], check=True)
          subprocess.run(['node', 'scripts/plugin/sync-agent-plugin.mjs'], check=True)
          code = "import {snapshot} from './skill-evals/architecture-zoom/evaluate.mjs';console.log(snapshot(process.cwd()).sourceFingerprint)"
          fingerprint = subprocess.check_output(['node', '--input-type=module', '-e', code], text=True).strip()
          assert fingerprint == '3829bf13edae8cc038c04a118afcd5fe8f36a72c9f82a4e22c2cf3d92ebf61c1'
          admission = Path('skill-evals/architecture-zoom/public-admission.json')
          data = json.loads(admission.read_text())
          assert data['sourceFingerprint'] == '72e025770a5e3139b22c1fea666c7d920131b702ebf2f851491a7c3ef7cde95b'
          data['sourceFingerprint'] = fingerprint
          data['maintenanceNote'] += ' Follow-up: the release-impact gate requires component patch versions for these delivered documentation changes. The reviewed Compass metadata version advances from 0.13.1 to 0.13.2, and this binding is refreshed for that metadata-only delta. Zoom/interviewer content, frozen cases, admission authority and unobserved native-host status remain unchanged; no release is published by this feature PR.'
          admission.write_text(json.dumps(data, indent=2) + '\n')
          subprocess.run(formatter + [str(admission)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          assert changed == set(expected), changed ^ set(expected)
          for relative, sha in expected.items():
              assert hashlib.sha256(Path(relative).read_bytes()).hexdigest() == sha, relative
          (Path(os.environ['RUNNER_TEMP']) / 'pr197-version-files.json').write_text(json.dumps(expected, indent=2) + '\n')
          print('All 14 candidate files match the locally tested fingerprints. No runtime or root release version changed.')
          PY
      - name: Verify component versions and affected contracts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 009dcdce2f94f3b20f6e36a83cee68d0e1baff3e
          node scripts/release/check-release-intent.mjs --base-ref 009dcdce2f94f3b20f6e36a83cee68d0e1baff3e
          node scripts/catalog/validate-skills.mjs
          node scripts/plugin/validate-release-descriptor.mjs
          node scripts/plugin/validate-openai-listing.mjs
          node scripts/plugin/sync-agent-plugin.mjs --check
          node scripts/catalog/sync-planning-templates.mjs --check
          node skill-evals/architecture-zoom/validate-contract.mjs
          bun test skill-evals/architecture-zoom/evaluate.test.mjs
      - name: Create reviewed candidate objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          assert os.environ['GITHUB_REPOSITORY'] == 'stark-ai-de/agent-skills'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/lens-debug-skill'
          expected = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr197-version-files.json').read_text())
          for relative, sha in expected.items():
              assert hashlib.sha256(Path(relative).read_bytes()).hexdigest() == sha, relative
          def api(path, payload=None):
              request = Request('https://api.github.com/repos/stark-ai-de/agent-skills/' + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urlopen(request, timeout=60) as response:
                  return json.load(response)
          parent = os.environ['GITHUB_SHA']
          base = api('git/commits/' + parent)
          entries = [{'path': relative, 'mode': '100644', 'type': 'blob', 'content': Path(relative).read_text()} for relative in expected]
          entries.append({'path': '.github/workflows/pr197-version-repair.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('git/trees', {'base_tree': base['tree']['sha'], 'tree': entries})
          commit = api('git/commits', {'message': 'fix(ci): version updated skills and generated bundle metadata', 'tree': tree['sha'], 'parents': [parent]})
          receipt = {'parent': parent, 'candidate_commit': commit['sha'], 'candidate_tree': tree['sha'], 'files': expected, 'ref_updated': False, 'removed_controls': ['.github/workflows/pr197-version-repair.yml']}
          (Path(os.environ['RUNNER_TEMP']) / 'pr197-version-candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('Created unreferenced candidate ' + commit['sha'] + '; no ref, PR state, release or deployment changed.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr197-version-candidate
          path: ${{ runner.temp }}/pr197-version-candidate.json
          retention-days: 1
          if-no-files-found: error
