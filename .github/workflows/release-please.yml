name: 📝 Release Please

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout exact main candidate
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 🛡️ Verify trusted protected-main source
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/main"
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/release-please.yml@${expected_ref}"
          candidate_sha=$(git rev-parse HEAD)
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)

          test "${GITHUB_REF}" = "${expected_ref}"
          test "${WORKFLOW_REF}" = "${expected_workflow_ref}"
          test "${WORKFLOW_SHA}" = "${candidate_sha}"
          test "${GITHUB_SHA}" = "${candidate_sha}"
          test "${main_sha}" = "${candidate_sha}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')" = "true"

      - name: 🧭 Classify current main update
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          associated_titles=""
          if [ "$EVENT_NAME" = "push" ]; then
            test "${BEFORE_SHA}" != "0000000000000000000000000000000000000000"
            git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || \
              git fetch --no-tags --depth=1 origin "${BEFORE_SHA}"
            associated_titles=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null) | .title] | join("\n")')
          fi
          ASSOCIATED_TITLES="${associated_titles}" \
            COMMIT_TITLE="$(git log -1 --pretty=%s)" \
            bun --bun scripts/release/classify-release-please-trigger.mjs --github-output

      - name: 🎯 Select release preparation configuration
        if: ${{ steps.classify.outputs.skip != 'true' }}
        id: release-config
        run: |
          set -euo pipefail
          manifest_version=$(bun --bun --eval 'const manifest = await Bun.file(".release-please-manifest.json").json(); console.log(manifest["."])')
          if [ "${manifest_version}" = "0.20.1" ]; then
            echo "config_file=release-please-config.v0.21.0.json" >> "$GITHUB_OUTPUT"
          else
            echo "config_file=release-please-config.json" >> "$GITHUB_OUTPUT"
          fi
          if [ "${manifest_version}" = "0.25.2" ]; then
            echo "forward_recovery=true" >> "$GITHUB_OUTPUT"
          else
            echo "forward_recovery=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔎 Verify unpublished release incident
        if: ${{ steps.release-config.outputs.forward_recovery == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: bun --bun scripts/release/prepare-forward-release.mjs --preflight

      - name: 🟢 Setup isolated release preparation runtime
        if: ${{ steps.release-config.outputs.forward_recovery == 'true' }}
        uses: pnpm/setup@v3
        with:
          runtime: node@24.18.0
          cache: false
          install: false

      - name: 📦 Install pinned one-time Release Please library
        if: ${{ steps.release-config.outputs.forward_recovery == 'true' }}
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/release-please-forward"
          mkdir -p "$tool_dir"
          printf '%s\n' '{"private":true,"dependencies":{"release-please":"17.6.0"}}' > "$tool_dir/package.json"
          pnpm --dir "$tool_dir" install --ignore-scripts --no-frozen-lockfile

      - name: 🔎 Preview forward release without writes
        if: ${{ steps.release-config.outputs.forward_recovery == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node scripts/release/prepare-forward-release.mjs --plan

      - name: 🔑 Create repository-scoped release App token
        if: ${{ steps.classify.outputs.skip != 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: 📝 Create forward release PR with Release Please
        if: ${{ steps.release-config.outputs.forward_recovery == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node scripts/release/prepare-forward-release.mjs --apply

      - name: 📝 Create or update draft release PR
        if: ${{ steps.classify.outputs.skip != 'true' && steps.release-config.outputs.forward_recovery != 'true' }}
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: ${{ steps.release-config.outputs.config_file }}
          manifest-file: .release-please-manifest.json

      - name: 🧭 Summarize release preparation
        if: ${{ always() }}
        uses: ./.github/actions/write-run-summary
        with:
          title: Release Please
          success: Release Please updated the draft version PR or intentionally skipped its own merged release PR. Publication still requires the protected Publish Release workflow.
          failure: Inspect the failed preflight or preparation step. For unpublished v0.25.2 follow docs/release-recovery-0.25.2.md; do not create a substitute tag.
