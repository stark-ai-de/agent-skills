name: Hetzner native diagnosis

on:
  pull_request:
    paths:
      - ".github/workflows/hetzner-native-diagnosis.yml"
      - "scripts/validation/hetzner-inference-setup/**"
      - "skills/engineering-workflows/hetzner-inference-setup/**"

permissions:
  contents: read

concurrency:
  group: hetzner-diagnosis-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.18.0
          install: false
      - name: Prepare pinned offline validation tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          tools="$RUNNER_TEMP/hetzner-tools"
          mkdir -p "$tools/bin" "$tools/node_modules/@oxfmt" "$tools/node_modules/@oxlint"
          cp -L "$(command -v node)" "$tools/bin/node"
          cp -LR node_modules/oxfmt "$tools/node_modules/oxfmt"
          cp -LR node_modules/oxlint "$tools/node_modules/oxlint"
          cp -LR node_modules/.pnpm/tinypool@2.1.0/node_modules/tinypool "$tools/node_modules/tinypool"
          cp -LR node_modules/.pnpm/@oxfmt+binding-linux-x64-gnu@0.63.0/node_modules/@oxfmt/binding-linux-x64-gnu "$tools/node_modules/@oxfmt/binding-linux-x64-gnu"
          cp -LR node_modules/.pnpm/@oxlint+binding-linux-x64-gnu@1.78.0/node_modules/@oxlint/binding-linux-x64-gnu "$tools/node_modules/@oxlint/binding-linux-x64-gnu"
          tar -czf "$RUNNER_TEMP/hetzner-tools.tar.gz" -C "$tools" .
      - name: Upload pinned validation tools
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: hetzner-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/hetzner-tools.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Reproduce native ACL boundary without credentials
        run: node --test scripts/validation/hetzner-inference-setup/windows-acl.test.mjs
