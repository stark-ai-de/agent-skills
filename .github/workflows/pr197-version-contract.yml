name: PR 197 curator version contract

on:
  push:
    branches: [codex/lens-debug-skill]
    paths: [.github/workflows/pr197-version-contract.yml]

permissions: {}

jobs:
  prepare:
    if: github.repository == 'stark-ai-de/agent-skills' && github.ref == 'refs/heads/codex/lens-debug-skill'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          runtime: node@24.18.0
          cache: false
          install: false
      - name: Update only the exact version contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7098eaa13f92c846c6f040f90309806fae4666df
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('scripts/validation/memory-curators/validate.mjs')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '5d8883bc07359d32d65c703090139513ba495d911f50bb1b8647f561190b13ea'
          old = 'const expectedVersion = curator.runtime === "codex" ? "0.2.4" : "0.2.2";'
          new = 'const expectedVersion = { claude: "0.2.3", codex: "0.2.5", cursor: "0.2.2" }[curator.runtime];'
          text = path.read_text()
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '7ac95340f010f06c189f808a55a2346caa0cc177ba32e7b828bb8a502ab76774'
          PY
      - name: Run unchanged curator and Lens regression tests
        run: |
          node scripts/validation/memory-curators/validate.mjs
          python3 -B incubator/skills/engineering-workflows/lens-debug/tests/test_lens_read.py
      - name: Create candidate commit without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          path = Path('scripts/validation/memory-curators/validate.mjs')
          expected = '7ac95340f010f06c189f808a55a2346caa0cc177ba32e7b828bb8a502ab76774'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
          def api(route, payload=None):
              request = Request('https://api.github.com/repos/stark-ai-de/agent-skills/' + route,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urlopen(request, timeout=60) as response:
                  return json.load(response)
          parent = os.environ['GITHUB_SHA']
          base = api('git/commits/' + parent)
          tree = api('git/trees', {'base_tree': base['tree']['sha'], 'tree': [
              {'path': str(path), 'mode': '100644', 'type': 'blob', 'content': path.read_text()},
              {'path': '.github/workflows/pr197-version-contract.yml', 'mode': '100644', 'type': 'blob', 'sha': None},
          ]})
          commit = api('git/commits', {'message': 'fix(ci): align curator contracts with reviewed patch versions', 'tree': tree['sha'], 'parents': [parent]})
          receipt = {'parent': parent, 'candidate_commit': commit['sha'], 'candidate_tree': tree['sha'], 'files': {str(path): expected}, 'ref_updated': False}
          (Path(os.environ['RUNNER_TEMP']) / 'pr197-version-contract.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('Created unreferenced candidate ' + commit['sha'] + '; no branch or release changed.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr197-version-contract
          path: ${{ runner.temp }}/pr197-version-contract.json
          retention-days: 1
          if-no-files-found: error
