name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
      release_kind:
        description: Release kind
        required: true
        default: initial
        type: choice
        options:
          - initial
          - patch
          - minor
          - major
      dry_run:
        description: Validate without committing or opening a PR
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: npm run validate

      - name: Prepare release files
        run: |
          args=(--version "${{ inputs.version }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/prepare-release.mjs "${args[@]}"

      - run: npm run validate

      - run: node scripts/validate-release.mjs --version "${{ inputs.version }}"

      - run: pnpm format:check

      - run: pnpm lint

      - run: git diff --check

      - name: Open or update release PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          branch="release/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add package.json CHANGELOG.md skills

          if git diff --cached --quiet; then
            echo "No release file changes to commit."
            exit 0
          fi

          git commit -m "chore: prepare v${VERSION}"
          git push --force-with-lease origin "${branch}"

          cat > release-pr-body.md <<BODY
          ## Release

          Version: v${VERSION}
          Kind: ${RELEASE_KIND}

          ## Validation

          - npm run validate
          - pnpm format:check
          - pnpm lint
          - git diff --check

          ## Before Merge

          - Review package and skill version changes.
          - Review CHANGELOG.md release notes.
          - If normal PR CI did not run automatically, dispatch the Validate workflow manually for this branch.

          ## After Merge

          Run the Publish Release workflow with version ${VERSION}.
          BODY

          if gh pr view "${branch}" --json number >/dev/null 2>&1; then
            gh pr edit "${branch}" --title "chore: prepare v${VERSION}" --body-file release-pr-body.md
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore: prepare v${VERSION}" \
              --body-file release-pr-body.md
          fi
