name: Attest Release Archives

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose zip-store-v1 archives should be attested
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: attest-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: ⬇️ Checkout tagged identity
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: 🟢 Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0
          cache: true
          install: false

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 📦 Package zip-store-v1 plugin archives
        run: npm run package:agent-plugin && npm run package:openai-plugin

      - name: 🔏 Attest plugin archives
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/openai/*.zip
            dist/agent-plugins/*.zip
