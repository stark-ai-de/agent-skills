name: Attest Release Archives

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose zip-store-v1 archives should be attested
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: attest-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: 🛡️ Resolve trusted verifier source
        id: verifier
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          repository=$(gh api "repos/${GITHUB_REPOSITORY}")
          default_branch=$(printf '%s' "${repository}" | jq -r '.default_branch')
          if [ "${default_branch}" != "main" ]; then
            echo "The release trust contract requires main as the protected default branch."
            exit 1
          fi

          branch=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${default_branch}")
          verifier_sha=$(printf '%s' "${branch}" | jq -r '.commit.sha')
          protected=$(printf '%s' "${branch}" | jq -r '.protected')
          verifier_ref="${GITHUB_REPOSITORY}/.github/workflows/attest-release.yml@refs/heads/${default_branch}"

          if [ "${protected}" != "true" ] || [[ ! "${verifier_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Default branch must be protected and resolve to a full commit SHA."
            exit 1
          fi
          if [ "${WORKFLOW_SHA}" != "${verifier_sha}" ] || [ "${WORKFLOW_REF}" != "${verifier_ref}" ]; then
            echo "Running workflow source does not match the protected default-branch verifier."
            exit 1
          fi

          {
            echo "verifier_sha=${verifier_sha}"
            echo "verifier_ref=${verifier_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: ⬇️ Checkout workflow sources
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.verifier.outputs.verifier_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 Prepare tag-bound release subjects
        id: release
        uses: ./.github/actions/post-release-subjects
        with:
          tag: ${{ inputs.tag }}
          subjects-dir: release-subjects
          verifier-sha: ${{ steps.verifier.outputs.verifier_sha }}
          verifier-ref: ${{ steps.verifier.outputs.verifier_ref }}

      - name: 🚫 Require prepared release subjects
        if: ${{ always() }}
        env:
          PREPARATION_OUTCOME: ${{ steps.release.outcome }}
          PACKAGE_STATUS: ${{ steps.release.outputs.package_status }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          WORKFLOW_SHA: ${{ steps.verifier.outputs.verifier_sha }}
        run: |
          set -euo pipefail
          if [ "${PREPARATION_OUTCOME}" != "success" ]; then
            echo "Release-subject preparation failed; refusing to report a successful attestation run."
            exit 1
          fi
          if [ "${RELEASE_TAG}" = "v0.19.1" ]; then
            if [ "${PACKAGE_STATUS}" != "not_applicable" ]; then
              echo "Historical v0.19.1 subjects must be not_applicable, got ${PACKAGE_STATUS:-empty}."
              exit 1
            fi
          else
            if [ "${PACKAGE_STATUS}" != "pass" ]; then
              echo "Release subjects must pass before attestation, got ${PACKAGE_STATUS:-empty}."
              exit 1
            fi
            if [ -z "${RELEASE_SHA}" ] || [ "${WORKFLOW_SHA}" != "${RELEASE_SHA}" ]; then
              echo "Workflow source ${WORKFLOW_SHA} does not match release source ${RELEASE_SHA:-empty}; refusing to attest."
              exit 1
            fi
          fi

      - name: 🔏 Attest plugin archives
        if: ${{ steps.release.outcome == 'success' && steps.release.outputs.package_status == 'pass' && steps.release.outputs.release_sha != '' && env.RELEASE_TAG != 'v0.19.1' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            release-subjects/openai.zip
            release-subjects/portable.zip

      - name: 🧭 Summarize run
        if: ${{ always() }}
        uses: ./.github/actions/write-run-summary
        with:
          title: Attest release subjects
          success: This attestation does not replace Publish Release plus Post-release Evidence. Continue from docs/publishing.md.
          failure: Fix the archive or permission failure, then rerun this workflow for the exact tag.
