name: PR 197 repair snapshot

on:
  push:
    branches: [codex/lens-debug-skill]
    paths: [.github/workflows/pr197-ci-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          runtime: node@24.18.0
          cache: false
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Archive only source and verification tooling
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr197-snapshot"
          mkdir -p "$out/runtime"
          git archive --format=tar HEAD | gzip -9 > "$out/source.tar.gz"
          git rev-parse HEAD > "$out/source-sha.txt"
          for tool in node bun pnpm; do
            cp "$(readlink -f "$(command -v "$tool")")" "$out/runtime/$tool"
          done
          find . -type d -name node_modules -prune -print0 > "$RUNNER_TEMP/pr197-modules.txt"
          tar --null -czf "$out/dependencies.tar.gz" -T "$RUNNER_TEMP/pr197-modules.txt"
          tar -C "$out" -czf "$out/runtime.tar.gz" runtime
          rm -r "$out/runtime"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr197-repair-workspace
          path: ${{ runner.temp }}/pr197-snapshot/
          retention-days: 1
          if-no-files-found: error
