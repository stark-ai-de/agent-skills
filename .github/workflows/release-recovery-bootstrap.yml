name: Recovery preparation (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-recovery-bootstrap.yml

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/release-please-unpublished-baseline' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.18.0
          cache: false
          install: false
      - name: Resolve the isolated pinned recovery dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-tooling"
          printf '%s\n' '{"private":true,"dependencies":{"release-please":"17.6.0"}}' > "$RUNNER_TEMP/recovery-tooling/package.json"
          pnpm --dir "$RUNNER_TEMP/recovery-tooling" --ignore-workspace install --lockfile-only --ignore-scripts
          git bundle create "$RUNNER_TEMP/recovery-source.bundle" --all
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-preparation
          path: |
            ${{ runner.temp }}/recovery-tooling/package.json
            ${{ runner.temp }}/recovery-tooling/pnpm-lock.yaml
            ${{ runner.temp }}/recovery-source.bundle
          if-no-files-found: error
          retention-days: 3
