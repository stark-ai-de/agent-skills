name: Forward release preparation contract

on:
  pull_request:
    paths:
      - .github/workflows/forward-release-contract.yml
      - .github/workflows/release-please.yml
      - release-please-config.json
      - package.json
      - site/package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .bun-version
      - scripts/release/prepare-forward-release.mjs
      - scripts/release/forward-release-tool/**
      - scripts/validation/test-forward-release.mjs
      - scripts/validation/test-forward-release-install.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/forward-release-contract.yml
      - .github/workflows/release-please.yml
      - release-please-config.json
      - package.json
      - site/package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .bun-version
      - scripts/release/prepare-forward-release.mjs
      - scripts/release/forward-release-tool/**
      - scripts/validation/test-forward-release.mjs
      - scripts/validation/test-forward-release-install.mjs

permissions:
  contents: read

jobs:
  forward-release-contract:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24.18.0
          cache: false
          install: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Test incident guards and preparation-only contract
        run: bun --bun scripts/validation/test-forward-release.mjs
      - name: Qualify frozen bootstrap without release credentials
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/release-please-forward"
          mkdir -p "$tool_dir/site" "$tool_dir/scripts/release/forward-release-tool"
          cp package.json pnpm-workspace.yaml pnpm-lock.yaml "$tool_dir/"
          cp site/package.json "$tool_dir/site/"
          cp scripts/release/forward-release-tool/package.json "$tool_dir/scripts/release/forward-release-tool/"
          pnpm --dir "$tool_dir" --filter agent-skills-forward-release-tool install --prod --ignore-scripts --frozen-lockfile
          bun --bun scripts/validation/test-forward-release-install.mjs "$tool_dir/scripts/release/forward-release-tool"
