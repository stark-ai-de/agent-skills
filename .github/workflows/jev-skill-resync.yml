name: Verify bounded Jev Windows hint correction

on:
  push:
    branches: [codex/jev-portable-network-contract]

permissions:
  contents: write

concurrency:
  group: jev-portable-resync-once
  cancel-in-progress: false

jobs:
  resync:
    if: ${{ github.repository == 'stark-ai-de/agent-skills' && github.ref == 'refs/heads/codex/jev-portable-network-contract' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.18.0
          cache: false
          install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - name: Format touched evaluation documentation
        run: pnpm exec oxfmt --write skill-evals/jev-capability-advisor/README.md
      - name: Generate canonical projection
        run: pnpm run sync:agent-plugin
      - name: Run the complete existing Jev suite
        run: pnpm run validate:jev
      - name: Validate generated projection
        run: pnpm run validate:projections
      - name: Record only canonical and generated allowlisted files
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git show afb2e45e7a61031e7340ce09a07332c067365282:.github/jev-skill-revision.py > "$RUNNER_TEMP/jev-publish.py"
          python3 -B "$RUNNER_TEMP/jev-publish.py" publish
