name: Validate

on:
  workflow_dispatch:
    inputs:
      architecture_workers:
        description: Architecture Compass fixture workers for full benchmark runs
        required: true
        default: "1"
        type: choice
        options:
          - auto
          - "1"
          - "2"
          - "3"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      trusted_main: ${{ steps.context.outputs.trusted_main }}
      validation_scope: ${{ steps.validation.outputs.validation_scope }}
      pages_artifact_name: ${{ steps.artifact-names.outputs.pages_artifact_name }}
      validation_artifact_name: ${{ steps.artifact-names.outputs.validation_artifact_name }}
      pages_artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize validation diagnostic boundary
        run: node scripts/ci/initialize-validation-diagnostic.mjs --output "$RUNNER_TEMP/validation-boundary.json"

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Resolve validation context
        id: context
        run: |
          echo "trusted_main=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}" >> "$GITHUB_OUTPUT"

      - name: Resolve attempt-scoped artifact names
        id: artifact-names
        run: |
          echo "pages_artifact_name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "validation_artifact_name=validation-receipt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Resolve full or affected validation plan
        id: validation-plan
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          node scripts/ci/resolve-validation-plan.mjs \
            --event "$GITHUB_EVENT_NAME" \
            --base-sha "${BASE_SHA:-none}" \
            --candidate-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/validation-plan.json" \
            --github-output

      - name: Install selected validation dependencies
        id: dependencies
        if: ${{ steps.validation-plan.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/ci/install-validation-dependencies.mjs --plan "$RUNNER_TEMP/validation-plan.json"

      - name: Run validation plan
        id: validation
        if: ${{ always() && steps.validation-plan.outcome == 'success' }}
        env:
          ARCHITECTURE_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.architecture_workers || '1' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          node scripts/ci/run-validation-plan.mjs \
            --plan "$RUNNER_TEMP/validation-plan.json" \
            --report "$RUNNER_TEMP/validation-report.json" \
            --event "$GITHUB_EVENT_NAME" \
            --base-sha "${BASE_SHA:-none}" \
            --architecture-workers "$ARCHITECTURE_WORKERS" \
            --dependency-install-outcome "${{ steps.dependencies.outcome }}" \
            --before-fingerprint "$RUNNER_TEMP/validation-boundary.json" \
            --github-output

      - name: Finalize validation diagnostic report
        if: ${{ always() }}
        env:
          DIAGNOSTIC_REASON: validation plan=${{ steps.validation-plan.outcome }}, dependencies=${{ steps.dependencies.outcome }}, runner=${{ steps.validation.outcome }}
        run: |
          node scripts/ci/finalize-validation-diagnostic.mjs \
            --boundary "$RUNNER_TEMP/validation-boundary.json" \
            --manifest scripts/ci/validation-manifest.json \
            --plan "$RUNNER_TEMP/validation-plan.json" \
            --report "$RUNNER_TEMP/validation-report.json" \
            --reason "$DIAGNOSTIC_REASON"

      - name: Upload diagnostic validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail planning before validation runner
        if: ${{ always() && steps.validation-plan.outcome != 'success' }}
        run: exit 1

      - name: Assert validated site output
        id: site-digest
        if: ${{ steps.context.outputs.trusted_main == 'true' && steps.validation.outputs.validation_scope == 'full' }}
        run: |
          set -euo pipefail
          test -n "$(find site/dist -type f -print -quit)"
          digest=$(cd site/dist && find . -type f -print0 | sort -z | while IFS= read -r -d '' file; do sha256sum "$file"; done | sha256sum | cut -d' ' -f1)
          echo "site_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: ${{ steps.context.outputs.trusted_main == 'true' && steps.validation.outputs.validation_scope == 'full' }}
        uses: actions/configure-pages@v6

      - name: Verify sealed site output
        if: ${{ steps.context.outputs.trusted_main == 'true' && steps.validation.outputs.validation_scope == 'full' }}
        env:
          EXPECTED_SITE_DIGEST: ${{ steps.site-digest.outputs.site_digest }}
        run: |
          set -euo pipefail
          digest=$(cd site/dist && find . -type f -print0 | sort -z | while IFS= read -r -d '' file; do sha256sum "$file"; done | sha256sum | cut -d' ' -f1)
          test "$digest" = "$EXPECTED_SITE_DIGEST"

      - name: Upload validated Pages artifact
        id: pages-artifact
        if: ${{ steps.context.outputs.trusted_main == 'true' && steps.validation.outputs.validation_scope == 'full' }}
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact-names.outputs.pages_artifact_name }}
          path: site/dist
          include-hidden-files: true
          retention-days: 30

      - name: Write validation receipt schema v2
        if: ${{ steps.context.outputs.trusted_main == 'true' && steps.validation.outputs.validation_scope == 'full' }}
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: ${{ steps.artifact-names.outputs.pages_artifact_name }}
          SITE_DIGEST: ${{ steps.site-digest.outputs.site_digest }}
          VALIDATION_ARTIFACT_NAME: ${{ steps.artifact-names.outputs.validation_artifact_name }}
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/validation-proof"
          mkdir -p "$proof_root"
          cp "$RUNNER_TEMP/validation-report.json" "$proof_root/validation-report.json"
          node scripts/ci/write-validation-receipt.mjs \
            --manifest scripts/ci/validation-manifest.json \
            --report "$proof_root/validation-report.json" \
            --output "$proof_root/validation-receipt.json"

      - name: Upload validation proof
        if: ${{ steps.context.outputs.trusted_main == 'true' && steps.validation.outputs.validation_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-names.outputs.validation_artifact_name }}
          path: ${{ runner.temp }}/validation-proof
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: validate
    if: ${{ needs.validate.result == 'success' && needs.validate.outputs.trusted_main == 'true' && needs.validate.outputs.validation_scope == 'full' }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Verify deployment is current main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$main_sha" != "$EXPECTED_SHA" ]; then
            echo "Skipping stale Pages deployment: main is $main_sha, but this run validates $EXPECTED_SHA." >&2
            exit 1
          fi

      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.validate.outputs.pages_artifact_name }}
