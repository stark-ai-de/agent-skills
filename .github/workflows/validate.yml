name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 📥 Fetch pull-request base
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: 🟢 Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0
          cache: true
          install: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 🧾 Test post-release receipt contract
        run: pnpm run test:post-release-receipt

      - name: ✅ Validate repository contracts
        run: pnpm run validate

      - name: 📦 Validate release archives
        run: pnpm run validate:archives

      - name: 🔁 Verify release reproducibility and prepare hosted subjects
        id: release-subjects
        uses: ./.github/actions/build-release-subjects
        with:
          subjects-dir: ${{ runner.temp }}/release-subjects
          report-file: ${{ runner.temp }}/release-subject-report.json

      - name: ⬆️ Upload hosted OpenAI subject
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: openai.zip
          path: ${{ runner.temp }}/release-subjects/openai.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: ⬆️ Upload hosted portable subject
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: portable.zip
          path: ${{ runner.temp }}/release-subjects/portable.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: ⬆️ Upload hosted release metadata
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-subject.json
          path: ${{ runner.temp }}/release-subjects/release-subject.json
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: 🎨 Check formatting
        run: pnpm run format:check

      - name: 🧹 Lint scripts
        run: pnpm run lint

      - name: 🏷️ Check release intent
        id: release-intent
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm run release:intent -- --base-ref "${{ github.event.pull_request.base.sha }}" --github-output

      - name: 🔏 Verify generated release-PR provenance
        if: ${{ github.event_name == 'pull_request' && steps.release-intent.outputs.contract_kind == 'release-pr' }}
        env:
          EXPECTED_APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun --bun scripts/release/verify-release-please-merge.mjs
          --repository "$GITHUB_REPOSITORY"
          --pull-request "${{ github.event.pull_request.number }}"
          --expected-app-id "$EXPECTED_APP_ID"

      - name: 🚀 Validate planned release
        if: ${{ github.event_name == 'pull_request' && steps.release-intent.outputs.release_intent == 'true' }}
        run: pnpm run release:validate -- --version "${{ steps.release-intent.outputs.release_version }}" --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: 📋 List public skills
        run: pnpm dlx skills@1.5.23 add ./skills --list

      - name: 🧪 Smoke-install public skills
        run: pnpm run smoke:install

      - name: 🧭 Summarize validation
        if: ${{ always() }}
        uses: ./.github/actions/write-run-summary
        with:
          title: Repository validation
          success: Use the three direct release-subject artifacts only from a successful main push; pull requests do not publish them. Next hosted step is Publish Release in docs/publishing.md. Operator follow-up is docs/publishing.md#operator-follow-up.
          failure: Open the failed contract step, fix the owning boundary, and rerun the workflow.

  archive-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TZ: UTC
      LC_ALL: C
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - name: 📌 Pin Git to LF checkouts
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🟢 Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0
          cache: true
          install: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 📦 Package zip-store-v1 archives
        run: bun exec "pnpm run package:agent-plugin && pnpm run package:openai-plugin"

      - name: 🧾 Report archive identity
        run: bun --bun scripts/release/report-archive-identity.mjs

      - name: 📤 Upload archive identity
        uses: actions/upload-artifact@v4
        with:
          name: archive-identity-${{ matrix.os }}
          path: dist/archive-identity.json

      - name: 🧭 Summarize archive identity
        if: ${{ always() }}
        uses: ./.github/actions/write-run-summary
        with:
          title: Archive identity · ${{ matrix.os }}
          success: Let the aggregate comparison job check this platform report.
          failure: Inspect the platform-specific ZIP identity output, then rerun after correction.

  archive-identity-compare:
    needs: archive-identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🟢 Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24.18.0
          cache: true
          install: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: 📥 Download identity reports
        uses: actions/download-artifact@v4
        with:
          pattern: archive-identity-*
          path: dist/archive-identities

      - name: ⚖️ Compare zip-store-v1 identity
        run: bun --bun scripts/release/compare-archive-identity.mjs dist/archive-identities

      - name: 🧭 Summarize archive comparison
        if: ${{ always() }}
        uses: ./.github/actions/write-run-summary
        with:
          title: Cross-platform archive comparison
          success: All platform archive identities match; continue with release readiness.
          failure: Open the platform identity artifacts and fix the cross-platform mismatch.
